# 기본 botsort.yaml 복사본.
# track_buffer=30(기본)이면 차량처럼 큰 물체에 1초 이상 가려지면 버퍼가 끝나서
# ReID를 켜도 무조건 새 ID가 발급됨. 90까지 올리면 사람 많은 영상에서 트랙이 쌓여 느려짐.
# -> 60(약 2초)으로 절충: 차량 가려짐 정도는 버티면서 속도 저하는 최소화.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3     # 0.25 -> 0.3 (오검출로 인한 불필요한 새 ID 생성을 줄임)
track_buffer: 60          # 40 -> 60 (차량 등 큰 물체에 1초+ 가려지는 경우 대응)
match_thresh: 0.7         # 0.8 -> 0.7 (하반신 가려짐으로 박스 모양이 바뀌어도 매칭 허용)
fuse_score: True


gmc_method: sparseOptFlow

# proximity_thresh: ReID(외형 매칭)를 "시도라도 해볼지" 먼저 걸러내는 IoU 기준.
# 0.5로 두면 하반신이 가려져 박스가 쪼그라든 경우 이 기준을 못 넘어서
# with_reid=True 여도 외형 비교 자체가 발동을 안 함 -> 낮춰서 이런 경우도 ReID가 작동하게 함
proximity_thresh: 0.3
appearance_thresh: 0.1
with_reid: True
model: auto
